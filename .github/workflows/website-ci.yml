name: MAXYRON Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-route-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js
        run: npm run build

      - name: Verify page sources and cross-navigation
        run: node scripts/verify-site-structure.mjs

      - name: Validate corporate-to-product integration registry
        run: node scripts/validate-integration-registry.mjs
